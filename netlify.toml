[build]
  publish = "frontend"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "DENY"
    Content-Security-Policy = "default-src 'self'; connect-src 'self' http://127.0.0.1:8765; script-src 'self'; style-src 'self'; img-src 'self' data:; frame-ancestors 'none'"
